<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="m7Title m7Desc">
  <title id="m7Title">Croqui do mapa 07: O Pantanal</title>
  <desc id="m7Desc">Água, lama, ilhas e trilhas de gado. A coluna segue a trilha para a fronteira; as patrulhas do governo vêm do norte e do leste. A cobertura é escassa de propósito.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#c9b58d" stroke-width="0.55"/>
    </pattern>
    <marker id="arrowheadColumn" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f6574"/>
    </marker>
    <marker id="arrowheadLegalist" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a2f24"/>
    </marker>
    <style>
      .title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #3f321f; }
      .sub { font: 13px 'Segoe UI', Arial, sans-serif; fill: #6b5a3e; }
      .frame { fill: #efe3c3; stroke: #5a4628; stroke-width: 2; }
      .water { fill: #8bb7c9; stroke: #4d7d90; stroke-width: 1.5; }
      .ford { fill: #c9d9c6; stroke: #5b8a78; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .mud { fill: #b9a77e; stroke: #8b7a58; stroke-width: 1; opacity: .8; }
      .island { fill: #b7b47a; stroke: #7d7a48; stroke-width: 1.2; }
      .scrub { fill: #b7b47a; stroke: #7d7a48; stroke-width: 1; }
      .trail { fill: none; stroke: #9c7d53; stroke-width: 5; stroke-dasharray: 8 5; stroke-linecap: round; }
      .road { fill: none; stroke: #8b6a45; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .woods { fill: #8faa6a; stroke: #5f7b43; stroke-width: 1.2; }
      .building { fill: #b98f63; stroke: #6d4d2f; stroke-width: 1.5; }
      .zone-column { fill: #2f7f8f; fill-opacity: .18; stroke: #1f6574; stroke-width: 2; stroke-dasharray: 7 4; }
      .zone-legalist { fill: #a33f32; fill-opacity: .16; stroke: #8a2f24; stroke-width: 2; stroke-dasharray: 7 4; }
      .objective { fill: #fff8e8; stroke: #3f321f; stroke-width: 2; }
      .objective.column { fill: #d7eef1; stroke: #1f6574; }
      .objText { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #2b2418; text-anchor: middle; dominant-baseline: middle; }
      .objValue { font: 700 10px 'Segoe UI', Arial, sans-serif; fill: #5a4628; text-anchor: middle; }
      .label { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #3c311f; }
      .small { font: 12px 'Segoe UI', Arial, sans-serif; fill: #5f5038; }
      .zoneLabel { font: 700 12px 'Segoe UI', Arial, sans-serif; letter-spacing: .08em; }
      .border { fill: none; stroke: #6b5a3e; stroke-width: 2; stroke-dasharray: 2 5; }
      .arrowColumn { fill: none; stroke: #1f6574; stroke-width: 3.5; marker-end: url(#arrowheadColumn); }
      .arrowLegalist { fill: none; stroke: #8a2f24; stroke-width: 3.5; marker-end: url(#arrowheadLegalist); }
      .note { font: 11px 'Segoe UI', Arial, sans-serif; fill: #6b5a3e; }
    </style>
  </defs>

  <rect width="1000" height="700" fill="#f7f0df"/>
  <text x="40" y="40" class="title">07 · O Pantanal</text>
  <text x="40" y="62" class="sub">A marcha é o inimigo. A coluna atravessa lama, água e ilhas pela trilha de gado; a fronteira é o único objetivo que resta.</text>

  <rect x="50" y="86" width="900" height="560" class="frame"/>
  <rect x="50" y="86" width="900" height="560" fill="url(#grid)"/>

  <path d="M 50 140 C 150 110, 250 160, 340 140 C 420 120, 480 180, 470 250 C 460 320, 380 340, 340 400 C 300 460, 330 520, 260 560 C 200 590, 120 570, 50 580 Z" class="water"/>
  <path d="M 520 120 L 950 120 L 950 260 C 880 290, 820 260, 760 290 C 700 320, 650 300, 590 320 C 540 335, 510 300, 520 260 Z" class="water"/>
  <path d="M 520 430 C 600 400, 680 430, 760 410 C 840 390, 900 420, 950 440 L 950 620 L 520 620 C 500 560, 540 500, 520 430 Z" class="water"/>

  <path d="M 330 120 C 390 110, 460 140, 500 190 C 540 240, 520 290, 560 330 C 600 370, 610 420, 660 440 C 710 460, 760 450, 810 480 C 860 510, 890 550, 920 610 L 780 620 C 760 570, 720 540, 680 520 C 630 495, 590 470, 560 430 C 520 380, 490 330, 450 300 C 410 270, 380 240, 360 200 Z" class="mud"/>

  <path d="M 260 560 C 300 500, 340 450, 390 410 C 440 370, 500 350, 540 310 C 580 270, 610 230, 660 200 C 710 170, 760 150, 820 145" class="trail"/>
  <text x="500" y="480" class="label">TRILHA DE GADO</text>

  <path d="M 50 610 C 160 590, 260 600, 360 620" class="road"/>
  <text x="120" y="600" class="small">acesso ao acampamento</text>

  <path d="M 380 380 C 420 370, 450 390, 460 420 C 470 455, 430 480, 400 470 C 370 460, 360 420, 380 380 Z" class="island"/>
  <path d="M 560 300 C 600 290, 630 310, 640 340 C 650 370, 620 390, 590 380 C 560 370, 545 340, 560 300 Z" class="island"/>
  <path d="M 720 200 C 760 190, 790 210, 795 235 C 800 260, 770 275, 745 265 C 715 255, 705 225, 720 200 Z" class="island"/>
  <path d="M 650 110 C 720 100, 820 100, 910 110 L 930 210 C 850 230, 760 225, 660 220 Z" class="island"/>
  <path d="M 190 180 C 240 165, 300 175, 330 200 L 320 255 C 280 270, 230 260, 195 240 Z" class="island"/>

  <path d="M 300 470 C 330 450, 360 445, 390 450" class="ford"/>
  <path d="M 470 330 C 510 320, 540 325, 570 340" class="ford"/>
  <path d="M 650 235 C 680 225, 710 225, 735 235" class="ford"/>

  <rect x="230" y="200" width="55" height="35" class="building"/>
  <text x="210" y="190" class="small">rancho</text>
  <path d="M 700 140 L 730 160 M 700 160 L 730 140" stroke="#6b5a3e" stroke-width="2"/>
  <text x="700" y="190" class="small">marco</text>

  <path d="M 50 118 L 950 118" class="border"/>
  <text x="70" y="112" class="small">fronteira · Bolívia / Paraguai</text>

  <path d="M 100 520 L 340 520 L 340 620 L 100 620 Z" class="zone-column"/>
  <text x="116" y="544" class="zoneLabel" fill="#1f6574">COLUNA</text>
  <text x="116" y="562" class="small">feridos e animais</text>

  <path d="M 660 110 L 910 110 L 910 220 L 660 220 Z" class="zone-legalist"/>
  <text x="676" y="134" class="zoneLabel" fill="#8a2f24">PATRULHAS</text>
  <text x="676" y="152" class="small">norte e leste</text>

  <circle cx="380" cy="520" r="21" class="objective column"/>
  <text x="380" y="520" class="objText">1</text>
  <text x="380" y="544" class="objValue">v1</text>
  <circle cx="540" cy="400" r="21" class="objective"/>
  <text x="540" y="400" class="objText">2</text>
  <text x="540" y="424" class="objValue">v2</text>
  <circle cx="620" cy="280" r="21" class="objective"/>
  <text x="620" y="280" class="objText">3</text>
  <text x="620" y="304" class="objValue">v3</text>
  <circle cx="780" cy="160" r="21" class="objective"/>
  <text x="780" y="160" class="objText">4</text>
  <text x="780" y="184" class="objValue">v2</text>
  <circle cx="290" cy="220" r="21" class="objective"/>
  <text x="290" y="220" class="objText">5</text>
  <text x="290" y="244" class="objValue">v1</text>

  <path d="M 300 520 C 330 470, 370 430, 410 400 C 460 360, 510 340, 550 315" class="arrowColumn"/>
  <path d="M 580 280 C 620 250, 660 220, 720 180" class="arrowColumn"/>
  <path d="M 700 220 C 660 260, 630 300, 610 330" class="arrowLegalist"/>
  <path d="M 820 220 C 780 260, 750 300, 720 330" class="arrowLegalist"/>

  <text x="380" y="590" class="small">1 · entrar no alagado</text>
  <text x="520" y="455" class="small">2 · ilha</text>
  <text x="600" y="345" class="small">3 · última travessia</text>
  <text x="790" y="205" class="small">4 · fronteira</text>

  <text x="70" y="668" class="note">Tamanho sugerido: grande (640 m) · paleta cerrado · 06h, sol a leste · norte 0° · base lama · muita água rasa e alguns vaús.</text>
  <text x="70" y="686" class="note">Cobertura escassa é intencional: o aviso de 60 m do editor é esperado. Use capim e mato para ocultar, não para dar cobertura.</text>
</svg>
